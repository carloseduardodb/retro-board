<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabotador da Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#10152a; --ink2:#181f3b; --ink3:#222a4d; --line:#313b6b;
  --text:#e9edf8; --muted:#9aa4c8; --paper:#eef1f6; --paper-ink:#1b2033;
  --duck:#ffcd3c; --alarm:#ff4d5e; --ok:#3ddc97; --qa:#6cc4ff; --tl:#b69cff;
  --display:'Bricolage Grotesque','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font:16px/1.45 var(--body);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
code,.mono{font-family:var(--mono)}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#app{min-height:100%;padding-inline:16px}

/* buttons */
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink3);color:var(--text);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);transition:transform .08s ease,background .15s ease,box-shadow .08s ease}
.btn:hover{background:#2c3663}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.pick:focus-visible,.duckpick:focus-visible,.flip:focus-visible{outline:3px solid var(--duck);outline-offset:3px}
.btn.primary{background:var(--duck);color:#2a2100}
.btn.primary:hover{background:#ffd95f}
.btn.danger{background:var(--alarm);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}

/* ---------- home ---------- */
.home{max-width:720px;margin:0 auto;padding-block:48px 32px;display:grid;gap:28px}
.home h1{font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:-.02em}
.home h1 em{font-style:normal;color:var(--duck)}
.home p.lead{font-size:18px;color:var(--muted);max-width:56ch;margin:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.choice{text-align:left;display:grid;gap:8px;padding:20px;border-radius:18px;background:var(--ink2);border:2px solid var(--line);cursor:pointer;transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--duck)}
.choice:active{transform:scale(.98)}
.choice:focus-visible{outline:3px solid var(--duck);outline-offset:3px}
.choice b{font:700 22px/1.1 var(--display)}
.choice span{color:var(--muted);font-size:15px}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:0}
.duckparade{display:flex;gap:6px;flex-wrap:wrap}
.duckparade svg{width:44px;height:auto}

/* ---------- host ---------- */
.host{max-width:1280px;margin:0 auto;padding-block:20px;display:grid;gap:18px;min-height:100%;grid-template-rows:auto 1fr auto auto}
.hb{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;justify-content:space-between}
.hb h1{font-size:clamp(28px,4.2vw,52px);font-weight:800;letter-spacing:-.015em}
.hb h1 b{color:var(--duck)}
.hb .meta{display:flex;align-items:center;gap:20px}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:34px;height:10px;border-radius:5px;background:var(--ink3);display:block}
.pips i.on{background:var(--duck)} .pips i.bad{background:var(--alarm)} .pips i.good{background:var(--ok)}
.clock{font:600 clamp(34px,5vw,64px)/1 var(--mono);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.clock.low{color:var(--alarm)}
.stage{background:var(--ink2);border-radius:24px;padding:clamp(20px,3vw,40px);position:relative;overflow:hidden;min-height:320px;display:grid;align-content:center;gap:18px}
.stage h2{font-size:clamp(28px,4vw,54px);font-weight:800}
.stage p.big{font-size:clamp(18px,2vw,24px);color:var(--muted);margin:0;max-width:60ch}
.stage.alarm{animation:strobe .6s steps(2) 5}
@keyframes strobe{0%{background:#5a1020}50%{background:var(--ink2)}}
.siren{font:600 14px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--alarm);display:flex;align-items:center;gap:10px}
.siren::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--alarm);box-shadow:0 0 0 0 var(--alarm);animation:ping 1.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.incident{font:700 clamp(26px,3.6vw,46px)/1.12 var(--display)}
.incident small{display:block;font:400 clamp(17px,1.8vw,22px)/1.4 var(--body);color:var(--muted);margin-top:10px}
.progress{height:8px;background:var(--ink3);border-radius:4px;overflow:hidden;max-width:520px}
.progress i{display:block;height:100%;background:var(--duck);width:0;transition:width .3s}
.ducks{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;align-items:end}
.dk{display:grid;justify-items:center;gap:6px;text-align:center;position:relative;padding-top:52px}
.dk svg{width:84px;height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.dk .nm{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .st{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:14px}
.dk .st.ok{color:var(--ok)}
.dk .bubble{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);font-size:13px;line-height:1.2;padding:6px 9px;border-radius:10px;width:max-content;max-width:150px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.dk .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.dk.out svg{filter:grayscale(1) opacity(.45)}
.dk.out .nm{color:var(--muted);text-decoration:line-through}
.dk .tag{font:600 11px/1 var(--mono);background:var(--ink3);color:var(--muted);padding:4px 6px;border-radius:6px}
.dk.new svg{animation:plop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes plop{from{transform:translateY(-30px) scale(.6);opacity:0}}
.dk.bob svg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.hctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hctl .sp{flex:1}
.hctl .conn{font:600 12px/1 var(--mono);color:var(--muted);letter-spacing:.06em}
.hctl .conn.on{color:var(--ok)}
.joinhint{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.joinhint ol{margin:0;padding-left:22px;font-size:clamp(17px,1.7vw,21px);display:grid;gap:6px}
.joinhint code{font-size:.85em;color:var(--duck);overflow-wrap:anywhere}
.count{font:800 clamp(56px,8vw,110px)/1 var(--display);color:var(--duck);text-align:right}
.count small{display:block;font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.tally{display:grid;gap:10px;max-width:760px}
.tally .row{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center}
.tally .row .who{display:flex;gap:8px;align-items:center;font-weight:700;overflow:hidden;white-space:nowrap}
.tally .row .who svg{width:28px;flex:none}
.tally .bar{height:22px;background:var(--ink3);border-radius:6px;overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--duck);border-radius:6px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.tally .row.top .bar i{background:var(--alarm)}
.tally .n{font:600 18px/1 var(--mono);text-align:right}
@keyframes grow{from{transform:scaleX(0)}}
.verdict{font:800 clamp(24px,3.2vw,40px)/1.15 var(--display)}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--alarm)}
.timeline{display:grid;gap:14px;max-height:52vh;overflow:auto;padding-right:6px}
.tl-round{background:var(--ink3);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.tl-round h3{font-size:18px}
.tl-round ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.tl-round li.fake{color:var(--alarm)}
.tl-round .mono{font-size:13px}
.pm-grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:22px;align-items:start}
.pm-card{background:var(--ink3);border-radius:16px;padding:18px;display:grid;gap:10px;justify-items:start}
.pm-card svg{width:90px}
.pm-card p{margin:0}
.retro{text-align:center;justify-items:center}
.retro h2{max-width:22ch}

/* ---------- player ---------- */
.player{max-width:460px;margin:0 auto;padding-block:18px 32px;display:grid;gap:16px}
.ptop{display:flex;align-items:center;gap:10px}
.ptop svg{width:40px}
.ptop .who{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptimer{font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.ptimer.low{color:var(--alarm)}
.card{background:var(--ink2);border-radius:20px;padding:20px;display:grid;gap:14px}
.card h2{font-size:26px}
.card p{margin:0}
.muted{color:var(--muted)}
label.lbl{font:600 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{width:100%;font:700 20px/1.2 var(--body);padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--text)}
input[type=text]:focus{outline:none;border-color:var(--duck)}
.duckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.duckpick{appearance:none;border:2px solid transparent;background:var(--ink3);border-radius:14px;padding:8px 4px 4px;cursor:pointer;display:grid;justify-items:center;gap:2px;transition:border-color .12s,transform .1s}
.duckpick svg{width:54px}
.duckpick span{font-size:11px;color:var(--muted)}
.duckpick:hover{border-color:var(--line)}
.duckpick:active{transform:scale(.95)}
.duckpick[aria-pressed=true]{border-color:var(--duck);background:#2d2a2a}
.duckpick[disabled]{opacity:.3;cursor:not-allowed}
.flip{appearance:none;border:0;padding:0;background:none;cursor:pointer;perspective:900px;width:100%;display:block;text-align:left}
.flip .in{position:relative;min-height:220px;transition:transform .5s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;display:grid}
.flip.open .in{transform:rotateY(180deg)}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:grid;align-content:center;gap:10px}
.flip .back{background:repeating-linear-gradient(135deg,var(--ink3) 0 14px,#262f57 14px 28px);text-align:center;justify-items:center}
.flip .back b{font:700 22px/1.2 var(--display)}
.flip .front{transform:rotateY(180deg);background:var(--paper);color:var(--paper-ink)}
.flip .front h2{font-size:34px}
.flip .front p{margin:0;font-size:17px}
.flip .front .eyebrow{color:#5b6388}
.front.sab{background:#ffe1e4} .front.sab h2{color:#c81d34}
.front.qa h2{color:#1d6fa8} .front.tl h2{color:#6a45d8} .front.dev h2{color:#1b7a52}
.clue{font:400 16px/1.5 var(--mono)}
.front .clue{color:var(--paper-ink)}
.opts{display:grid;gap:8px}
.pick{appearance:none;border:2px solid var(--line);background:var(--ink);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-weight:700;transition:border-color .12s,background .12s,transform .08s}
.pick svg{width:30px;flex:none}
.pick:hover{border-color:var(--muted)}
.pick:active{transform:scale(.98)}
.pick[aria-pressed=true]{border-color:var(--duck);background:#29264a}
.pick.skip{font-weight:400;color:var(--muted)}
.pill{display:inline-block;font:600 12px/1 var(--mono);letter-spacing:.06em;padding:6px 8px;border-radius:8px;background:var(--ink3);color:var(--muted)}
.pill.ok{background:rgba(61,220,151,.15);color:var(--ok)}
.pill.bad{background:rgba(255,77,94,.15);color:var(--alarm)}
.result{border-radius:14px;padding:14px;background:var(--ink);font-size:16px}
.result.good{box-shadow:inset 0 0 0 2px var(--ok)} .result.bad{box-shadow:inset 0 0 0 2px var(--alarm)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--ink3);border-top-color:var(--duck);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.statusline{font:600 12px/1.3 var(--mono);color:var(--muted);text-align:center}

@media (max-width:700px){
  .pm-grid{grid-template-columns:1fr}
  .joinhint{grid-template-columns:1fr}
  .count{text-align:left}
  .tally .row{grid-template-columns:100px 1fr 32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="v-boot" class="home"><p class="eyebrow">Conectando ao quadro…</p></section>
  <section id="v-home" class="home" hidden></section>
  <section id="v-host" class="host" hidden>
    <header class="hb">
      <div><p class="eyebrow" id="h-eyebrow">Sprint 42</p><h1 id="h-title">Faltam <b>3</b> dias para o deploy</h1></div>
      <div class="meta"><div class="pips" id="h-pips" aria-label="Incidentes"></div><div class="clock" id="h-clock" data-timer></div></div>
    </header>
    <main class="stage" id="h-stage"></main>
    <section class="ducks" id="h-ducks" aria-label="Patinhos"></section>
    <footer class="hctl" id="h-ctl"></footer>
  </section>
  <section id="v-player" class="player" hidden>
    <div class="ptop" id="p-top"></div>
    <div id="p-join" class="card" hidden>
      <h2>Entre no quadro</h2>
      <div style="display:grid;gap:8px"><label class="lbl" for="p-name">Seu nome</label>
      <input type="text" id="p-name" maxlength="14" autocomplete="off" placeholder="Ana"></div>
      <div style="display:grid;gap:8px"><span class="lbl">Seu patinho</span><div class="duckgrid" id="p-ducks"></div></div>
      <button class="btn primary" id="p-joinbtn">Entrar</button>
      <p class="statusline" id="p-joinstatus"></p>
    </div>
    <div id="p-main"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"></script>
<script>
'use strict';
/* ================= room sobre o Supabase Realtime =================
   O jogo nasceu como artifact do claude.ai e fala com window.claude.use('room').
   Aqui essa API é reimplementada num canal do Supabase, um por board (?board=TOKEN).
   Sem board ou sem conexão, use('room') devolve null e o jogo cai no modo demonstração. */
(() => {
  const board = (new URLSearchParams(location.search).get('board') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
  window.SAB_BOARD = board;
  const me = Math.random().toString(36).slice(2, 12);
  let roomP = null;

  async function makeRoom(){
    if (!board || !window.supabase) return null;
    const res = await fetch('/api/games/realtime-config');
    if (!res.ok) return null;
    const cfg = await res.json();
    if (!cfg.url || !cfg.anonKey) return null;
    const sb = window.supabase.createClient(cfg.url, cfg.anonKey, {auth:{persistSession:false, autoRefreshToken:false}});
    const ch = sb.channel('sabotador:' + board, {config:{broadcast:{self:false}, presence:{key:me}}});
    const msgL = new Map(), peerL = new Set(), connL = new Set();
    let status = 'CONNECTING', mine = null, known = new Set();

    const peers = () => Object.entries(ch.presenceState())
      .filter(([k]) => k !== me)
      .map(([k, metas]) => { const {presence_ref, ...presence} = metas[metas.length - 1] || {}; return {peer:k, presence}; });

    // Um único evento de broadcast; o nome do evento do jogo vai no payload.
    ch.on('broadcast', {event:'msg'}, ({payload}) => {
      if (!payload || typeof payload.ev !== 'string') return;
      for (const cb of msgL.get(payload.ev) || []) cb({peer:payload.peer, data:payload.data});
    });
    ch.on('presence', {event:'sync'}, () => {
      const now = new Set(peers().map(p => p.peer));
      const joined = [...now].filter(k => !known.has(k)), left = [...known].filter(k => !now.has(k));
      known = now;
      for (const cb of peerL) cb({joined, left});
    });

    const room = {
      peers,
      connected: () => status === 'SUBSCRIBED',
      presence(obj){ mine = obj; return status === 'SUBSCRIBED' ? ch.track(obj) : Promise.resolve(); },
      emit(ev, data){ return ch.send({type:'broadcast', event:'msg', payload:{ev, peer:me, data}}); },
      on(ev, cb){ if (!msgL.has(ev)) msgL.set(ev, []); msgL.get(ev).push(cb); },
      onPeers(cb){ peerL.add(cb); },
      onConnection(cb){ connL.add(cb); }
    };

    await new Promise(resolve => {
      const timeout = setTimeout(resolve, 5000);
      ch.subscribe(s => {
        status = s;
        if (s === 'SUBSCRIBED') { clearTimeout(timeout); resolve(); if (mine) ch.track(mine); }
        for (const cb of connL) cb(s);
      });
    });
    return room;
  }

  window.claude = {
    async use(name){
      if (name === 'room') return roomP || (roomP = makeRoom().catch(() => null));
      // Qualquer pessoa do board pode abrir o quadro; quem compartilha a tela escolhe.
      if (name === 'user') return {canEdit: async () => true};
      return null;
    }
  };
})();
</script>
<script>
'use strict';
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Chaves separadas por board, para a partida de um board não vazar para outro.
const NS = 'sab:' + (window.SAB_BOARD || 'demo') + ':';
const mkStore = kind => ({
  get(k){ try { const v = window[kind].getItem(NS + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v){ try { window[kind].setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { window[kind].removeItem(NS + k); } catch (e) {} }
});
const LS = mkStore('localStorage'), SS = mkStore('sessionStorage');
const fmtClock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const cleanName = s => String(s || '').replace(/[\u0000-\u001f​-‏‪-‮⁦-⁩]/g, '').trim().slice(0, 14) || 'Patinho';
const playerLink = () => location.origin + location.pathname + '?board=' + encodeURIComponent(window.SAB_BOARD || '');

/* ================= ducks ================= */
const DUCKS = [
  {n:'Amarelo', c:'#ffcd3c'}, {n:'Laranja', c:'#ff8a3d'}, {n:'Vermelho', c:'#f0525f'}, {n:'Rosa', c:'#ff8cc6'},
  {n:'Roxo', c:'#a585ff'}, {n:'Azul', c:'#4fb0ff'}, {n:'Verde', c:'#3ccf8e'}, {n:'Grafite', c:'#98a2b8'}
];
const duckIdx = d => (Number.isInteger(d) && d >= 0 && d < DUCKS.length) ? d : 0;
function duckSVG(d, label){
  const c = DUCKS[duckIdx(d)].c;
  return `<svg viewBox="0 0 72 58" role="img" aria-label="${esc(label || 'Patinho ' + DUCKS[duckIdx(d)].n)}">
  <path d="M5 29 L2 16 L15 25 Z" fill="${c}"/>
  <ellipse cx="31" cy="38" rx="26" ry="16" fill="${c}"/>
  <circle cx="45" cy="21" r="13" fill="${c}"/>
  <path d="M56 20 q12 0 13 5 q-6 4 -13 1 Z" fill="#ff8f1f"/>
  <circle cx="48" cy="17" r="2.4" fill="#141a30"/>
  <circle cx="41" cy="15" r="3.2" fill="#fff" opacity=".35"/>
  <path d="M17 37 q12 -10 24 0 q-12 8 -24 0 Z" fill="#000" opacity=".12"/>
  <ellipse cx="31" cy="53" rx="20" ry="3" fill="#000" opacity=".12"/>
</svg>`;
}

/* ================= crypto (clues and votes travel sealed) ================= */
const SUB = (window.crypto && crypto.subtle) || null;
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Crypt = {
  async identity(store, slot){
    if (!SUB) return {priv:null, pub:'none'};
    const saved = store.get('sab-key-' + slot);
    if (saved) {
      try { const priv = await SUB.importKey('jwk', saved.priv, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveKey']); return {priv, pub:saved.pub}; } catch (e) {}
    }
    try {
      const kp = await SUB.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']);
      const pub = b64(await SUB.exportKey('raw', kp.publicKey));
      store.set('sab-key-' + slot, {priv: await SUB.exportKey('jwk', kp.privateKey), pub});
      return {priv:kp.privateKey, pub};
    } catch (e) { return {priv:null, pub:'none'}; }
  },
  cache: new Map(),
  shared(me, otherPub){
    if (!SUB || !me || !me.priv || !otherPub || otherPub === 'none' || typeof otherPub !== 'string') return Promise.resolve(null);
    if (this.cache.has(otherPub)) return this.cache.get(otherPub);
    const p = (async () => {
      const pk = await SUB.importKey('raw', unb64(otherPub), {name:'ECDH', namedCurve:'P-256'}, false, []);
      return SUB.deriveKey({name:'ECDH', public:pk}, me.priv, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
    })().catch(() => null);
    this.cache.set(otherPub, p);
    return p;
  },
  async seal(key, obj){
    if (!key) return {p:obj};
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await SUB.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
    return {i:b64(iv), d:b64(ct)};
  },
  async open(key, box){
    if (!box || typeof box !== 'object') return null;
    if (box.p) return box.p;
    if (!key || typeof box.i !== 'string' || typeof box.d !== 'string') return null;
    try { const pt = await SUB.decrypt({name:'AES-GCM', iv:unb64(box.i)}, key, unb64(box.d)); return JSON.parse(new TextDecoder().decode(pt)); }
    catch (e) { return null; }
  }
};

let actx = null, soundOn = true;
function beep(freq, dur, type = 'square', gain = .05, when = 0){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sfx = {
  alarm(){ for (let i = 0; i < 6; i++) { beep(880, .22, 'sawtooth', .04, i * .5); beep(620, .22, 'sawtooth', .04, i * .5 + .25); } },
  quack(){ beep(420, .09, 'square', .05); beep(300, .12, 'square', .04, .08); },
  tick(){ beep(1200, .04, 'sine', .04); },
  reveal(good){ (good ? [523, 659, 784, 1046] : [392, 330, 262, 196]).forEach((f, i) => beep(f, .25, 'triangle', .06, i * .14)); }
};

/* ================= HOST ================= */
let G = null, hostId = null, lobby = [], hostDirty = true, lastRenderKey = '';
const actSeen = new Map();     // pid -> raw box string already applied
const privSent = new Map();    // pid -> {s, at}
let pubSent = {s:'', at:0};
const newGame = keep => ({gid:uid(), v:0, phase:'lobby', round:0, endsAt:null, roster:[], sab:null, rounds:[], plant:null, qa:null, tl:null, ready:{}, result:null, bots:keep ? keep : [], botAt:{}});
function cur(){ return G.rounds[G.round - 1] || null; }
function active(){ return G.roster.filter(p => !p.out); }
function nm(pid){ const p = G.roster.find(x => x.pid === pid) || lobby.find(x => x.pid === pid); return p ? p.name : '?'; }
function bump(){ G.v++; hostDirty = true; LS.set('sab-host-game', G); }

async function startHost(){
  mode = 'host';
  $('#v-host').hidden = false;
  hostId = await Crypt.identity(LS, 'host');
  G = LS.get('sab-host-game');
  if (!G || !G.gid) G = newGame();
  if (!room) G.bots = G.bots && G.bots.length ? G.bots : [];
  if (room) {
    room.presence({app:'sab', host:true, hk:hostId.pub, hs:Date.now()}).catch(() => {});
    room.onPeers(ch => { if (ch.joined.length) { pubSent.at = 0; privSent.clear(); } hostDirty = true; });
    room.onConnection(() => { hostDirty = true; });
  }
  setInterval(hostTick, 250);
  hostDirty = true;
}

function lobbyPlayers(){
  const map = new Map();
  if (room) for (const peer of room.peers()) {
    const pr = peer.presence || {};
    if (pr.app !== 'sab' || pr.host || typeof pr.pid !== 'string' || typeof pr.name !== 'string') continue;
    map.set(pr.pid.slice(0, 16), {pid:pr.pid.slice(0, 16), name:cleanName(pr.name), duck:duckIdx(pr.duck), pk:typeof pr.pk === 'string' ? pr.pk : 'none', act:pr.act || null, ag:pr.ag});
  }
  for (const b of G.bots) map.set(b.pid, b);
  return [...map.values()];
}

let ingesting = false;
async function hostTick(){
  if (ingesting) return;
  ingesting = true;
  try {
    const prev = JSON.stringify(lobby.map(p => [p.pid, p.name, p.duck]));
    lobby = lobbyPlayers();
    if (G.phase === 'lobby' && prev !== JSON.stringify(lobby.map(p => [p.pid, p.name, p.duck]))) { hostDirty = true; }
    for (const p of lobby) {
      if (!p.act || p.bot || p.ag !== G.gid) continue;
      const raw = JSON.stringify(p.act);
      if (actSeen.get(p.pid) === raw) continue;
      const rp = G.roster.find(x => x.pid === p.pid);
      const key = await Crypt.shared(hostId, rp ? rp.pk : p.pk);
      const act = await Crypt.open(key, p.act);
      actSeen.set(p.pid, raw);
      if (act) applyAct(p.pid, act);
    }
    botsAct();
    if (G.endsAt && Date.now() >= G.endsAt) advance(true);
    if (hostDirty) { renderHost(); hostDirty = false; }
    await broadcast();
  } catch (e) { console.error(e); }
  ingesting = false;
}

function applyAct(pid, a){
  const me = G.roster.find(p => p.pid === pid);
  if (!me || a.g !== G.gid) return;
  const c = cur(), r = G.round;
  if (G.phase === 'roles' && a.ready && !G.ready[pid]) { G.ready[pid] = true; bump(); if (active().every(p => G.ready[p.pid])) G.endsAt = Math.min(G.endsAt || Infinity, Date.now() + 1200); }
  if (me.out) return;
  const valid = t => active().some(p => p.pid === t);
  if (G.phase === 'incident' && pid === G.sab && !G.plant && a.plant && a.plant.r === r && valid(a.plant.t) && valid(a.plant.f) && a.plant.t !== G.sab && a.plant.f !== G.sab) { plant(a.plant.t, a.plant.f); }
  if ((G.phase === 'discuss' || G.phase === 'vote') && c) {
    if (me.role === 'qa' && !G.qa && a.qa && a.qa.r === r && valid(a.qa.t) && a.qa.t !== pid) { G.qa = {r, t:a.qa.t, fake:!!(c.clues[a.qa.t] && c.clues[a.qa.t].fake)}; bump(); }
    if (me.role === 'tl' && !G.tl && a.tl && a.tl.r === r && valid(a.tl.t) && a.tl.t !== pid) { G.tl = {r, t:a.tl.t, sab:a.tl.t === G.sab}; bump(); }
  }
  if (G.phase === 'vote' && c) {
    let ch = false;
    if (a.v && a.v.r === r && (a.v.t === 'skip' || (valid(a.v.t) && a.v.t !== pid)) && c.votes[pid] !== a.v.t) { c.votes[pid] = a.v.t; ch = true; }
    if (a.ex && a.ex.r === r && Number.isInteger(a.ex.i) && a.ex.i >= 0 && a.ex.i < EXCUSES.length && c.ex[pid] !== a.ex.i) { c.ex[pid] = a.ex.i; ch = true; }
    if (ch) { bump(); checkAllVoted(); }
  }
}
function checkAllVoted(){
  const c = cur();
  if (G.phase === 'vote' && active().every(p => c.votes[p.pid])) G.endsAt = Math.min(G.endsAt || Infinity, Date.now() + 2500);
}

/* ---- round generation ---- */
function ctxFor(roundObj){
  const S = G.sab;
  return {S, round:roundObj.n, devs:roundObj.devs, device:DEVICES[roundObj.dev], tAct:roundObj.tAct, tSlack:roundObj.tSlack, quote:roundObj.quote,
          inn:roundObj.act.filter(p => p !== S), nm};
}
function clueText(roundObj, cl){ return KINDS[cl.k].text(ctxFor(roundObj), cl); }
function makeRound(){
  const n = G.round;
  const act = active().map(p => p.pid);
  const usedDev = G.rounds.map(r => r.dev), usedInc = G.rounds.map(r => r.inc);
  const dev = pick([0, 1, 2, 3].filter(i => !usedDev.includes(i)));
  const inc = pick(INCIDENTS.map((_, i) => i).filter(i => !usedInc.includes(i)));
  const h = 9 + rnd(9), m = 5 + rnd(50);
  const tm = mm => `${h}h${String(mm).padStart(2, '0')}`;
  const ids = DEVICES[dev].ids(act.length);
  const devs = {}; act.forEach((p, i) => devs[p] = ids[i]);
  const R = {n, act, dev, inc, devs, tInc:tm(m + 1), tAct:tm(m), tSlack:tm(m - 3), quote:pick(QUOTES), clues:{}, votes:{}, ex:{}, out:null, sabOut:false, fate:''};
  const c = ctxFor(R);
  const deck = DECK[Math.min(3, n)];
  const kinds = deck.must.slice(0, act.length);
  while (kinds.length < act.length) kinds.push(pick(deck.fill));
  const holders = shuffle(act);
  kinds.forEach((k, i) => {
    const cl = c.inn.length ? KINDS[k].make(c) : {k:'initial', who:G.sab};
    R.clues[holders[i]] = {...cl, text:null};
  });
  for (const p in R.clues) R.clues[p].text = clueText(R, R.clues[p]);
  return R;
}
function plant(target, framed){
  const R = cur(), cl = R.clues[target];
  if (!cl) return;
  const kind = KINDS[cl.k] || KINDS[cl.k === 'inv' ? 'inv' : 'log'];
  const fk = {...kind.fake(ctxFor(R), cl, framed), fake:true, orig:cl.text};
  fk.text = clueText(R, fk);
  if (fk.text === cl.text) { const alt = {...KINDS.slack.fake(ctxFor(R), {k:'slack', who:G.sab}, framed), fake:true, orig:cl.text}; alt.text = clueText(R, alt); R.clues[target] = alt; }
  else R.clues[target] = fk;
  G.plant = {r:R.n, t:target, f:framed, text:R.clues[target].text, orig:cl.text};
  bump();
}

/* ---- phases ---- */
function setPhase(ph, ms){ G.phase = ph; G.endsAt = ms ? Date.now() + ms : null; G.botAt = {}; for (const b of G.bots) G.botAt[b.pid] = Date.now() + 1500 + rnd(ms ? Math.min(ms * .6, 20000) : 3000); bump(); }
function startGame(){
  const ps = lobby.slice(0, 8);
  if (ps.length < 3) return;
  const taken = new Set();
  const roster = ps.map(p => { let d = p.duck; if (taken.has(d)) d = DUCKS.findIndex((_, i) => !taken.has(i)); taken.add(d); return {pid:p.pid, name:p.name, duck:d, pk:p.pk, bot:!!p.bot, role:'dev', out:false}; });
  const order = shuffle(roster);
  order[0].role = 'sab';
  if (roster.length >= 4) order[1].role = 'qa';
  if (roster.length >= 5) order[2].role = 'tl';
  const bots = G.bots;
  G = newGame(bots);
  G.roster = roster; G.sab = order[0].pid;
  actSeen.clear(); privSent.clear();
  setPhase('roles', T.roles);
}
function startRound(){ G.round++; G.rounds.push(makeRound()); setPhase('incident', T.incident); sfx.alarm(); hostAlarm = true; }
function reveal(){
  const R = cur(), tally = {};
  let skip = 0;
  for (const p of active()) { const v = R.votes[p.pid]; if (!v || v === 'skip') skip++; else tally[v] = (tally[v] || 0) + 1; }
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  const max = top.length ? top[0][1] : 0;
  const leaders = top.filter(t => t[1] === max);
  R.tally = tally; R.skip = skip;
  if (max > 0 && leaders.length === 1 && max > skip) {
    const out = leaders[0][0];
    R.out = out; R.sabOut = out === G.sab;
    if (R.sabOut) G.result = 'team';
    else { G.roster.find(p => p.pid === out).out = true; R.fate = pick(FATES); }
  }
  if (!G.result) {
    const innLeft = active().filter(p => p.pid !== G.sab).length;
    if (G.round >= 3 || innLeft <= 1) G.result = 'sab';
  }
  setPhase('reveal', 0);
  sfx.reveal(R.sabOut);
}
function advance(auto){
  switch (G.phase) {
    case 'lobby': if (!auto) startGame(); break;
    case 'roles': startRound(); break;
    case 'incident': setPhase('discuss', T.discuss); break;
    case 'discuss': setPhase('vote', T.vote); break;
    case 'vote': reveal(); break;
    case 'reveal': if (!auto) { G.result ? setPhase('post', 0) : startRound(); } break;
    case 'post': if (!auto) setPhase('retro', 0); break;
    case 'retro': if (!auto) { const b = G.bots; G = newGame(b); bump(); } break;
  }
}

function botsAct(){
  const now = Date.now();
  for (const b of G.roster.filter(p => p.bot && !p.out)) {
    const at = G.botAt[b.pid];
    if (!at || now < at) continue;
    delete G.botAt[b.pid];
    const others = active().filter(p => p.pid !== b.pid);
    const a = {g:G.gid};
    if (G.phase === 'roles') a.ready = true;
    if (G.phase === 'incident' && b.role === 'sab' && Math.random() < .6) { const t = pick(others), f = pick(others.filter(p => p.pid !== t.pid) .concat(t)); a.plant = {r:G.round, t:t.pid, f:f.pid}; }
    if (G.phase === 'discuss' && (b.role === 'qa' || b.role === 'tl') && Math.random() < .7) a[b.role] = {r:G.round, t:pick(others).pid};
    if (G.phase === 'vote') {
      const sab = G.roster.find(p => p.pid === G.sab);
      const target = (b.pid !== G.sab && Math.random() < .35 && !sab.out) ? sab : pick(others);
      a.v = {r:G.round, t:Math.random() < .12 ? 'skip' : target.pid}; a.ex = {r:G.round, i:rnd(EXCUSES.length)};

}

function pubState(){
  const R = cur();
  const people = G.phase === 'lobby' ? lobby : G.roster;
  const st = {
    g:G.gid, ph:G.phase, r:G.round, days:Math.max(0, 4 - Math.max(1, G.round)),
    pl:people.map(p => ({id:p.pid, n:p.name, d:p.duck, o:p.out ? 1 : 0, rd:G.ready[p.pid] ? 1 : 0, vt:R && R.votes[p.pid] ? 1 : 0, ex:R && R.ex[p.pid] !== undefined ? R.ex[p.pid] : -1})),
    inc:R ? {t:fill(INCIDENTS[R.inc].t, {T:R.tInc}), d:INCIDENTS[R.inc].d} : null,
    res:G.result
  };
  if (R && (G.phase === 'reveal' || G.phase === 'post' || G.phase === 'retro')) st.rv = {out:R.out, sab:R.sabOut ? 1 : 0, fate:R.fate, tally:R.tally, skip:R.skip, votes:R.votes};
  if (G.phase === 'post' || G.phase === 'retro') st.sab = G.sab;
  return st;
}
function privFor(p){
  const R = cur();
  const o = {g:G.gid, role:p.role, out:p.out ? 1 : 0};
  if (R && ['discuss', 'vote', 'reveal'].includes(G.phase) && R.clues[p.pid]) o.clue = {r:R.n, text:R.clues[p.pid].text};
  if (p.role === 'sab') o.plant = G.plant ? {r:G.plant.r, t:G.plant.t, f:G.plant.f, text:G.plant.text} : null;
  if (p.role === 'qa') o.qa = G.qa;
  if (p.role === 'tl') o.tl = G.tl;
  return o;
}
async function broadcast(){
  if (!room || !room.connected()) return;
  const now = Date.now();
  const pub = pubState(), s = JSON.stringify(pub);
  if (s !== pubSent.s || now - pubSent.at > 2000) {
    pub.rem = G.endsAt ? Math.max(0, G.endsAt - now) : null;
    room.emit('state', pub).catch(e => { if (e && e.code === 'not_permitted' && !hostError) { hostError = 'Só quem pode editar este artifact consegue ser o host.'; hostDirty = true; } });
    pubSent = {s, at:now};
  }
  for (const p of G.roster) {
    if (p.bot) continue;
    const priv = privFor(p), ps = JSON.stringify(priv), prev = privSent.get(p.pid);
    if (prev && prev.s === ps && now - prev.at < 4000) continue;
    privSent.set(p.pid, {s:ps, at:now});
    const key = await Crypt.shared(hostId, p.pk);
    const box = await Crypt.seal(key, priv);
    room.emit('priv', {g:G.gid, to:p.pid, b:box}).catch(e => { if (e && e.code === 'not_permitted') hostError = 'Só quem pode editar este artifact consegue ser o host.'; });
  }
}

const P = {me:null, id:null, host:null, pub:null, pubAt:0, priv:null, act:{}, ui:{role:false, clue:false, sel:{}}, sealing:false};
async function startPlayer(){

    if (!isHostPeer(m.peer) || !m.data || typeof m.data !== 'object') return;
    const d = m.data;
    if (P.pub && P.pub.g !== d.g) { P.act = {}; P.priv = null; P.ui = {role:false, clue:false, sel:{}}; saveAct(); }
    const phaseChanged = !P.pub || P.pub.ph !== d.ph || P.pub.r !== d.r;
    if (phaseChanged) { P.ui.clue = false; P.ui.sel = {}; if (d.ph === 'roles') P.ui.role = false; }
    P.pub = d; P.pubAt = Date.now();
    if (P.act.g !== d.g) { P.act = {g:d.g}; saveAct(); }
    renderPlayer();
  });
  room.on('priv', async m => {
    if (!isHostPeer(m.peer) || !m.data || !P.me || m.data.to !== P.me.pid) return;
    const key = await Crypt.shared(P.id, P.host && P.host.hk);
    const o = await Crypt.open(key, m.data.b);
    if (!o) return;
    const s = JSON.stringify(o);
    if (s !== JSON.stringify(P.priv)) { P.priv = o; renderPlayer(); }
  });
  room.onPeers(() => { const h = findHost(); if ((h && h.peer) !== (P.host && P.host.peer)) { P.host = h; pushPresence(); renderPlayer(); } });
  room.onConnection(() => renderPlayer());
  setupJoin();
  if (P.me) pushPresence();
  renderPlayer();
}
function findHost(){
  let best = null;
  for (const peer of room.peers()) {
    const pr = peer.presence || {};
    if (pr.app === 'sab' && pr.host && (!best || (pr.hs || 0) > (best.hs || 0))) best = {peer:peer.peer, hk:pr.hk, hs:pr.hs};
  }
  return best;
}

  if (P.host && P.act.g) { const key = await Crypt.shared(P.id, P.host.hk); pr.act = await Crypt.seal(key, P.act); }

}

  } else if (!priv) {
    h = `<div class="card"><div class="spin"></div><p>Recebendo sua carta secreta…</p></div>`;
  } else if (priv.out && !['post', 'retro'].includes(pub.ph)) {
    h = `<div class="card"><h2>Você foi para o time de legado.</h2><p class="muted">Não vota mais, mas pode palpitar em voz alta. Você ${priv.role === 'sab' ? 'era' : 'não era'} o Sabotador.</p></div>`;
  } else {
    switch (pub.ph) {
      case 'roles':
        h = roleCard(priv, role) + `<button class="btn primary" id="pp-ready" ${P.act.ready ? 'disabled' : ''}>${P.act.ready ? 'Pronto. Espere os outros' : 'Entendi, pode esconder'}</button>`;
        break;
      case 'incident':
        h = `<div class="card"><p class="siren">Incidente</p><h2>${esc(pub.inc.t)}</h2><p class="muted">${esc(pub.inc.d)}</p></div>`;
        if (priv.role === 'sab' && !priv.plant && !(P.act.plant && P.act.plant.r === r)) h += plantUI(others);
        else if (priv.role === 'sab' && (priv.plant || P.act.plant)) h += `<div class="card"><p class="pill ${priv.plant ? 'ok' : ''}">${priv.plant ? 'Pista falsa plantada' : 'Plantando…'}</p>${priv.plant ? `<p class="clue">${esc(priv.plant.text)}</p><p class="muted">Agora está com ${esc(nameOf(priv.plant.t))}.</p>` : ''}</div>`;
        else h += `<div class="card"><div class="spin"></div><p class="muted">Coletando logs. Sua pista chega em instantes.</p></div>`;
        break;
      case 'discuss':
      case 'vote':
        h = clueCard(priv, pub) + (pub.ph === 'vote' ? voteUI(others) : powerUI(priv, others)) + roleMini(priv, role);
        break;
      case 'reveal': {
        const rv = pub.rv || {};
        const msg = rv.out ? (rv.sab ? `${nameOf(rv.out)} era o Sabotador.` : `${nameOf(rv.out)} ${rv.fate} Não era o Sabotador.`) : 'Ninguém foi realocado.';
        h = `<div class="card"><p class="eyebrow">Resultado</p><h2>${esc(msg)}</h2><p class="muted">${pub.res ? 'Fim de jogo. Olhe a tela compartilhada.' : 'Próximo incidente em breve.'}</p></div>`;
        break;
      }
      case 'post':
      case 'retro': {
        const won = (pub.res === 'team') !== (priv.role === 'sab');
        h = `<div class="card"><p class="eyebrow">Post-mortem</p><h2>${won ? 'Você venceu.' : 'Você perdeu.'}</h2>
          <p>O Sabotador era <b>${esc(nameOf(pub.sab))}</b>. Você era ${esc(role.name)}.</p><p class="muted">A linha do tempo completa está na tela compartilhada.</p></div>`;
        break;
      }
    }
  }
  main.innerHTML = h;
  wirePlayer(others);
}
const nameOf = pid => { const p = P.pub && P.pub.pl.find(x => x.id === pid); return p ? p.n : '?'; };
function roleCard(priv, role){
  return `<button class="flip ${P.ui.role ? 'open' : ''}" id="pp-role" aria-label="Toque para ver ou esconder seu papel"><div class="in">
    <div class="face back"><div class="duckparade">${duckSVG(P.me.duck)}</div><b>Toque para ver seu papel</b><span class="muted">Cubra a tela. É segredo.</span></div>
    <div class="face front ${priv.role}"><p class="eyebrow">Seu papel</p><h2>${esc(role.name)}</h2><p>${esc(role.text)}</p></div></div></button>`;
}
function roleMini(priv, role){ return `<p class="statusline">Papel secreto: <button class="btn ghost small" id="pp-peek">${P.ui.role ? esc(role.name) + ' (esconder)' : 'ver'}</button></p>`; }
function clueCard(priv, pub){
  if (!priv.clue) return `<div class="card"><div class="spin"></div><p>Recebendo sua pista…</p></div>`;
  return `<button class="flip ${P.ui.clue ? 'open' : ''}" id="pp-clue" aria-label="Toque para ver ou esconder sua pista"><div class="in">
    <div class="face back"><b>Sua pista do round ${pub.r}</b><span class="muted">Toque para ler. Ninguém mais vê esta pista.</span></div>
    <div class="face front ${priv.role === 'sab' ? 'sab' : 'dev'}"><p class="eyebrow">Pista · ${esc(pub.inc.t)}</p><p class="clue">${esc(priv.clue.text)}</p>
    ${priv.role === 'sab' ? '<p class="eyebrow">Ela é verdadeira. Você pode mentir sobre ela.</p>' : ''}</div></div></button>`;
}
function plantUI(others){
  const s = P.ui.sel;
  return `<div class="card"><p class="eyebrow">Só você vê isto</p><h2>Plantar pista falsa</h2>
    <p class="muted">Uma vez por partida. Escolha de quem é a pista que vai trocar e quem ela vai incriminar. Pode deixar para outro round.</p>
    <label class="lbl">Trocar a pista de</label><div class="opts" data-g="t">${others.map(p => personPick(p, s.t === p.id)).join('')}</div>
    <label class="lbl">Para incriminar</label><div class="opts" data-g="f">${others.map(p => personPick(p, s.f === p.id)).join('')}</div>
    <button class="btn danger" id="pp-plant" ${s.t && s.f ? '' : 'disabled'}>Plantar agora</button></div>`;
}
function powerUI(priv, others){
  const s = P.ui.sel, r = P.pub.r;
  if (priv.role === 'qa') {
    if (priv.qa) return `<div class="card"><p class="eyebrow">Teste de QA</p><div class="result ${priv.qa.fake ? 'bad' : 'good'}">A pista de <b>${esc(nameOf(priv.qa.t))}</b> no round ${priv.qa.r} é <b>${priv.qa.fake ? 'FALSA. Foi plantada' : 'verdadeira'}</b>.</div></div>`;
    if (P.act.qa) return `<div class="card"><div class="spin"></div><p>Rodando os testes…</p></div>`;
    return `<div class="card"><p class="eyebrow">Poder de QA · uma vez por partida</p><h2>Testar uma pista</h2><p class="muted">Descubra se a pista de alguém neste round é verdadeira.</p>
      <div class="opts" data-g="q">${others.map(p => personPick(p, s.q === p.id)).join('')}</div><button class="btn primary" id="pp-qa" ${s.q ? '' : 'disabled'}>Testar pista</button></div>`;
  }
  if (priv.role === 'tl') {
    if (priv.tl) return `<div class="card"><p class="eyebrow">git blame</p><div class="result ${priv.tl.sab ? 'bad' : 'good'}"><b>${esc(nameOf(priv.tl.t))}</b> ${priv.tl.sab ? '<b>É o Sabotador.</b>' : 'não é o Sabotador.'}</div></div>`;
    if (P.act.tl) return `<div class="card"><div class="spin"></div><p>Rodando git blame…</p></div>`;
    return `<div class="card"><p class="eyebrow">Poder de Tech Lead · uma vez por partida</p><h2>Rodar git blame</h2><p class="muted">Descubra se uma pessoa é ou não o Sabotador.</p>
      <div class="opts" data-g="b">${others.map(p => personPick(p, s.b === p.id)).join('')}</div><button class="btn primary" id="pp-tl" ${s.b ? '' : 'disabled'}>Rodar git blame</button></div>`;
  }
  if (priv.role === 'sab' && priv.plant) return `<div class="card"><p class="eyebrow">Sua pista falsa</p><p class="clue">${esc(priv.plant.text)}</p><p class="muted">Está com ${esc(nameOf(priv.plant.t))} desde o round ${priv.plant.r}.</p></div>`;
  return `<p class="statusline">Contem as pistas em voz alta. O timer está na tela compartilhada.</p>`;
}
function voteUI(others){
  const r = P.pub.r;
  const v = P.act.v && P.act.v.r === r ? P.act.v.t : null;
  const ex = P.act.ex && P.act.ex.r === r ? P.act.ex.i : -1;
  const got = P.pub.pl.find(p => p.id === P.me.pid);
  return `<div class="card"><p class="eyebrow">Votação</p><h2>Quem quebrou a sprint?</h2>
    <div class="opts" data-g="v">${others.map(p => personPick(p, v === p.id)).join('')}<button class="pick skip" type="button" data-id="skip" aria-pressed="${v === 'skip'}">Pular voto</button></div>
    <label class="lbl">Sua desculpa oficial</label>
    <div class="opts" data-g="e">${EXCUSES.map((e, i) => `<button class="pick" type="button" data-id="${i}" aria-pressed="${ex === i}">“${esc(e)}”</button>`).join('')}</div>
    <p class="statusline">${got && got.vt ? '✓ Voto registrado. Dá para mudar até o fim do tempo.' : (v ? 'Enviando voto…' : 'Toque em um suspeito.')}</p></div>`;
}
function wirePlayer(others){
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('pp-edit', () => { P.editing = true; renderPlayer(); });
  on('pp-role', () => { P.ui.role = !P.ui.role; $('#pp-role').classList.toggle('open', P.ui.role); });
  on('pp-clue', () => { P.ui.clue = !P.ui.clue; $('#pp-clue').classList.toggle('open', P.ui.clue); });
  on('pp-peek', () => { P.ui.role = !P.ui.role; renderPlayer(); });
  on('pp-ready', () => { P.ui.role = false; act({ready:true}); });
  const r = P.pub && P.pub.r;
  on('pp-plant', () => { const s = P.ui.sel; if (s.t && s.f) act({plant:{r, t:s.t, f:s.f}}); });
  on('pp-qa', () => { if (P.ui.sel.q) act({qa:{r, t:P.ui.sel.q}}); });
  on('pp-tl', () => { if (P.ui.sel.b) act({tl:{r, t:P.ui.sel.b}}); });
  document.querySelectorAll('#p-main .opts').forEach(g => {
    g.onclick = e => {
      const b = e.target.closest('.pick'); if (!b) return;
      const grp = g.dataset.g, id = b.dataset.id;
      if (grp === 'v') return act({v:{r, t:id}});
      if (grp === 'e') return act({ex:{r, i:+id}});
      P.ui.sel[grp] = id; renderPlayer();
    };
  });
}

/* ================= single animation loop: timers ================= */
let lastSec = null;
function frame(){
  let ms = null;
  if (mode === 'host' && G) ms = G.endsAt ? G.endsAt - Date.now() : null;
  if (mode === 'player') ms = remaining();
  const txt = ms == null ? '' : fmtClock(ms);
  const low = ms != null && ms < 10000;
  document.querySelectorAll('[data-timer]').forEach(el => { if (el.textContent !== txt) el.textContent = txt; el.classList.toggle('low', low); });
  if (mode === 'host' && low && ms > 0) { const s = Math.ceil(ms / 1000); if (s !== lastSec) { lastSec = s; sfx.tick(); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
boot();
</script>
</body>
