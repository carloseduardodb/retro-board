<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    As quatro colunas do board (bom, ruim, ideias, ações). A placa inverte com o
    tema do sistema para não sumir na barra de abas; as quatro cores são
    meio-tom de propósito, então leem tanto sobre a placa escura quanto a clara.
  -->
  <style>
    .tile { fill: #14171c; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f7fb; }
    }
  </style>
  <rect class="tile" width="180" height="180" rx="37" />
  <rect x="34" y="34" width="49" height="49" rx="13" fill="#34d399" />
  <rect x="97" y="34" width="49" height="49" rx="13" fill="#fb7185" />
  <rect x="34" y="97" width="49" height="49" rx="13" fill="#fbbf24" />
  <rect x="97" y="97" width="49" height="49" rx="13" fill="#60a5fa" />
</svg>
